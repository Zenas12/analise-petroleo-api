<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Análise do Preço do Barril de Petróleo</title>
  <style>
    body { background:#0a0a0a; color:#eee; font-family: Arial, sans-serif; margin:0; padding:0; }
    .wrap { max-width:900px; margin:50px auto; padding:30px; background:#111; border:2px solid #19ff7a; border-radius:10px; }
    h1 { color:#19ff7a; text-align:center; margin-top:0; }
    p { line-height:1.5; }
    ul { margin-left:20px; }
    .actions { text-align:center; margin-top:25px; }
    .btn { background:#19ff7a; color:#001; padding:12px 22px; border-radius:8px; text-decoration:none; font-weight:bold; }
    .btn:hover { opacity:0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Trabalho: Análise do Preço do Barril de Petróleo (USD)</h1>

    <div>
      {{ descricao|safe }}
    </div>

    <div class="actions">
      <a class="btn" href="/grafico">Ver gráfico da série histórica</a>
      &nbsp;&nbsp;
      <a class="btn" href="/forecast">Visualizar preços futuros (6 meses)</a>
    </div>
  </div>
</body>
</html>
